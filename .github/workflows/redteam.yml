name: redteam
# codystem-to-10of10 D3: CONTINUOUS red-team, run on every PR and nightly on a clean runner. Two
# real gates fail the job:
#   1. DETECTION ROUND — generate attacks (rotating seed window) + hunt the corpus through the guard;
#      red on any SLIP (a bypass) or OVERBLOCK (over-block regression) in the CURRENT guard.
#   2. SERIES GATE — src/redteam-check.ts reds on any REAL regression in the COMMITTED rolling series
#      bench/redteam/runs.jsonl (catch<100%, corpus shrank, discovery slope>0, MTTC=∞), but NOT while
#      the series is merely still accruing toward the ≥8-run proof.
# The dashboard is an informational artifact (never fails the job). NOTE: this workflow does NOT
# append to or persist the committed series — auto-accrual of new rows (nightly → auto-PR) is the
# still-open D3c task and an owner-facing decision (auto-commit policy on protected main).
on:
  pull_request:
  schedule:
    - cron: "17 4 * * *" # nightly
  workflow_dispatch:
jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:cli # dist/ is needed by the series gate + dashboard
      - name: detection round — red on any SLIP / OVERBLOCK in the current guard
        run: |
          s=$(date +%-j)   # day-of-year, no leading zero (avoids octal in $(()))
          node bench/redteam/run.mjs --runs-file "$RUNNER_TEMP/round.jsonl" --seeds "$s $((s + 1)) $((s + 2))"
      - name: series gate — red on any regression in the committed rolling series
        run: node dist/redteam-check.js bench/redteam/runs.jsonl
      - name: anti-decay heartbeat — red if any enforcement guarantee decayed (F5)
        run: bash scripts/anti-decay-check.sh
      - name: dashboard (informational artifact — never fails the job)
        if: always()
        continue-on-error: true
        run: node dist/redteam-dashboard.js bench/redteam/runs.jsonl "$RUNNER_TEMP/dashboard.md"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redteam-dashboard
          path: ${{ runner.temp }}/dashboard.md
          if-no-files-found: ignore
